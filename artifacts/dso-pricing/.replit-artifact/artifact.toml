kind = "web"
previewPath = "/"
title = "DSO Pricing Website"
version = "1.0.0"
id = "artifacts/dso-pricing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24934

[services.development]
run = "pnpm --filter @workspace/dso-pricing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dso-pricing", "run", "build" ]
publicDir = "artifacts/dso-pricing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24934"
BASE_PATH = "/"
